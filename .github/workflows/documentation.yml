name: Bilingual documentation
on:
  push:
    paths: ['**/*.md', 'scripts/check_docs.py', 'scripts/test_docs_check.py', '.github/workflows/documentation.yml']
  pull_request:
    paths: ['**/*.md', 'scripts/check_docs.py', 'scripts/test_docs_check.py', '.github/workflows/documentation.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python scripts/check_docs.py
      - run: python scripts/test_docs_check.py
      - run: node node_modules/prettier/bin/prettier.cjs --check '**/*.md' --embedded-language-formatting off
