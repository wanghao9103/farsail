name: Android rotation verification
on:
  push:
    branches: ["codex/fix-android-capture-rotation"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Restore original installed certificate
        env:
          APK_KEYSTORE: ${{ secrets.ANDROID_APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$APK_KEYSTORE"
          printf '%s' "$APK_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/farsail-installed.jks"
          chmod 600 "$RUNNER_TEMP/farsail-installed.jks"
      - run: cargo test --locked -p farsail-android
      - run: cargo clippy --locked -p farsail-android --all-targets -- -D warnings
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/farsail-installed.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APK_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: androiddebugkey
        run: scripts/build-android.sh :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signed-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
