name: Android rotation verification
on:
  push:
    branches: ["codex/fix-android-capture-rotation"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Apply only the rotation fix to the installed version
        run: |
          git diff --exit-code android-v0.1.8 HEAD -- crates Cargo.toml Cargo.lock .cargo scripts/build-android.sh
          git diff android-v0.1.8 HEAD -- apps/android/app/src/main/java/app/farsail/android/CaptureService.kt > "$RUNNER_TEMP/rotation.patch"
          git diff c10e01e HEAD -- apps/android/app/src/androidTest/java/app/farsail/android/NativeSmokeTest.kt >> "$RUNNER_TEMP/rotation.patch"
          git checkout --no-overlay android-v0.1.8 -- apps/android
          git apply --check "$RUNNER_TEMP/rotation.patch"
          git apply "$RUNNER_TEMP/rotation.patch"
      - name: Reuse checksum-verified unchanged official native libraries
        run: |
          curl --fail --location --retry 3 'https://github.com/wanghao9103/farsail/releases/download/android-v0.1.8/FarSail_Android_0.1.8_universal.apk' -o "$RUNNER_TEMP/base.apk"
          echo "afea5fa1d34d9700dcbb355d03beb790ec667c671775bf91369f4b56526fb3b9  $RUNNER_TEMP/base.apk" | sha256sum --check
          for abi in arm64-v8a x86_64; do
            mkdir -p "apps/android/app/src/main/jniLibs/$abi"
            unzip -j "$RUNNER_TEMP/base.apk" "lib/$abi/libfarsail_android.so" -d "apps/android/app/src/main/jniLibs/$abi"
          done
      - name: Restore original installed certificate
        env:
          APK_KEYSTORE: ${{ secrets.ANDROID_APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$APK_KEYSTORE"
          printf '%s' "$APK_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/farsail-installed.jks"
          chmod 600 "$RUNNER_TEMP/farsail-installed.jks"
      - name: Build and check the signed rotation-only APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/farsail-installed.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APK_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: androiddebugkey
        run: ./gradlew --no-daemon -PfarsailVersionCode=9 -PfarsailVersionName=0.1.8-clear :app:assembleRelease :app:testDebugUnitTest :app:lintRelease :app:compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signed-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
