name: Ubuntu client
on:
  push:
    paths:
      [
        "apps/desktop/**",
        "crates/core/**",
        "services/coordinator/**",
        "crates/client/**",
        "crates/transport/**",
        "crates/media/**",
        "crates/windows/**",
        "packages/ui/**",
        "package*.json",
        "Cargo.*",
        "rust-toolchain.toml",
        "scripts/test-*",
        ".github/workflows/linux-client.yml",
      ]
  pull_request:
    paths:
      [
        "apps/desktop/**",
        "crates/core/**",
        "services/coordinator/**",
        "crates/client/**",
        "crates/transport/**",
        "crates/media/**",
        "crates/windows/**",
        "packages/ui/**",
        "package*.json",
        "Cargo.*",
        "rust-toolchain.toml",
        "scripts/test-*",
        ".github/workflows/linux-client.yml",
      ]
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: farsail
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: farsail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farsail -d farsail_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      FARSAIL_TEST_DATABASE_URL: postgres://farsail:disposable_ci_password@127.0.0.1:5432/farsail_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Ubuntu native dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf gnome-keyring xvfb dbus-x11 fonts-noto-cjk pkexec
      - run: bash scripts/test-desktop-linux.sh
      - run: cargo test -p farsail-core -p farsail-coordinator
      - run: cargo test -p farsail-client --test coordinator_flow
      - name: WebKit UI and viewer regressions
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps webkit
          (cd apps/desktop && exec ../../node_modules/.bin/vite) > .local/vite.log 2>&1 &
          vite=$!
          trap 'kill "$vite"' EXIT
          for n in {1..30}; do curl -fsS http://127.0.0.1:1420/ >/dev/null 2>&1 && break; sleep 1; done
          UI_ENGINE=webkit node scripts/test-desktop-ui.cjs
          UI_ENGINE=webkit node scripts/test-remote-viewer.cjs
      - name: Debian package
        run: npm run tauri -w @farsail/desktop -- build --bundles deb --config src-tauri/tauri.linux.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-client
          path: target/release/bundle/deb/*.deb
