name: Android host
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/android/**', 'crates/android/**', 'crates/client/**', 'crates/transport/**', 'crates/media/**', 'crates/core/**', 'Cargo.*', 'scripts/build-android.sh', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo fmt -p farsail-android -- --check
      - run: cargo test --locked -p farsail-android
      - run: cargo clippy --locked -p farsail-android --all-targets -- -D warnings
      - run: scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FarSail-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports/lint-results-debug.html
