name: Android candidate package
on:
  push:
    branches: ["codex/android-update-*"]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - name: Check whether verified native libraries are unchanged
        id: native
        run: |
          if git diff --quiet 789dc7a175e262e6aa8aad840a267981176050a8 HEAD -- Cargo.toml Cargo.lock .cargo crates scripts/build-android.sh apps/android/app/build.gradle.kts apps/android/app/src/main/java/app/farsail/android/NativeBridge.kt; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.native.outputs.reuse == 'true'
        with:
          name: Android-signed-apk
          run-id: 43033361498
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-native-base
      - name: Verify original APK and restore exact native libraries
        if: steps.native.outputs.reuse == 'true'
        env:
          NATIVE_BASE_APK: ${{ runner.temp }}/verified-native-base/app-release.apk
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          apk = pathlib.Path(os.environ['NATIVE_BASE_APK'])
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == '90fb51f2054de681c0e5c5d93757feda843449d89b281bd822742096c3f3fc45'
          with zipfile.ZipFile(apk) as archive:
              for abi in ('arm64-v8a', 'x86_64'):
                  data = archive.read(f'lib/{abi}/libfarsail_android.so')
                  target = pathlib.Path('apps/android/app/src/main/jniLibs') / abi / 'libfarsail_android.so'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  print(abi, hashlib.sha256(data).hexdigest())
          PY
      - name: Restore original installed certificate
        env:
          APK_KEYSTORE: ${{ secrets.ANDROID_APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$APK_KEYSTORE"
          printf '%s' "$APK_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/farsail-installed.jks"
          chmod 600 "$RUNNER_TEMP/farsail-installed.jks"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p farsail-client --lib
        if: steps.native.outputs.reuse != 'true'
      - run: cargo test --locked -p farsail-transport
        if: steps.native.outputs.reuse != 'true'
      # Each multi-host scenario remains concurrent; isolate separate timed cases.
      - run: cargo test --locked -p farsail-android -- --test-threads=1
        if: steps.native.outputs.reuse != 'true'
      - run: cargo clippy --locked -p farsail-transport -p farsail-client -p farsail-android --all-targets -- -D warnings
        if: steps.native.outputs.reuse != 'true'
      - name: Build signed Android candidate
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/farsail-installed.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APK_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: androiddebugkey
          REUSE_NATIVE: ${{ steps.native.outputs.reuse }}
        run: |
          mobile_version="$(node -p "require('./apps/android/version.json').version")"
          if [[ "$REUSE_NATIVE" == 'true' ]]; then
            cd apps/android
            ./gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin "-PfarsailVersionName=${mobile_version}-wake1"
          else
            scripts/build-android.sh :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin "-PfarsailVersionName=${mobile_version}-wake1"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signed-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
