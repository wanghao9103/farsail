name: Viewer browser regressions
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: chromium
            browser: msedge
          - os: ubuntu-24.04
            engine: webkit
            browser: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UI_ENGINE: ${{ matrix.engine }}
      UI_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install isolated browser test tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/farsail-ui-tools" --no-save --package-lock=false playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/farsail-ui-tools/node_modules" >> "$GITHUB_ENV"
      - name: Install WebKit runtime
        if: runner.os == 'Linux'
        shell: bash
        run: node "$RUNNER_TEMP/farsail-ui-tools/node_modules/playwright/cli.js" install --with-deps webkit
      - name: Run complete desktop browser suites
        shell: bash
        run: |
          (cd apps/desktop && node ../../node_modules/vite/bin/vite.js --host 127.0.0.1 --port 1420 --strictPort) > viewer-vite.log 2>&1 &
          vite=$!
          trap 'kill "$vite" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:1420/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-desktop-ui.cjs
          node scripts/test-client-updates-ui.cjs
          node scripts/test-file-transfer-ui.cjs
          node scripts/test-remote-viewer.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-browser-${{ matrix.engine }}
          path: |
            .local/ui-verification/**
            .local/update-ui/**
            viewer-vite.log
          if-no-files-found: ignore
