name: System desktop host boundary
on:
  push:
    branches: [codex/uac-system-host]
    paths:
      [
        "crates/windows/**",
        "scripts/test-system-host.ps1",
        ".github/workflows/system-host-check.yml",
      ]
  workflow_dispatch:
    inputs:
      system_tools:
        description: "Open, capture, activate and close real system tools through the installed broker"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-preview
          cache-on-failure: true
      - name: Build system host
        shell: pwsh
        run: cargo build --locked --release -p farsail-windows --bin farsail-system-host
      - name: Validate native pipe backpressure and input policy
        shell: pwsh
        run: cargo test --locked --release -p farsail-windows --lib
      - name: Validate actual Task Manager window
        shell: pwsh
        run: |
          if (Get-Process Taskmgr -ErrorAction SilentlyContinue) { throw 'Unexpected existing Task Manager' }
          $env:FARSAIL_TEST_TASK_MANAGER='1'
          try {
            cargo test --locked --release -p farsail-windows --lib task_manager::tests::real_task_manager_window -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Real Task Manager window test failed' }
            Get-Process Taskmgr | Select-Object Id,SessionId,MainWindowHandle,Path | Format-List
          } finally {
            Get-Process Taskmgr -ErrorAction SilentlyContinue | Stop-Process -Force
          }
      - name: Validate session agent and capture
        shell: pwsh
        run: |
          if ('${{ inputs.system_tools }}' -eq 'true') { ./scripts/test-system-host.ps1 -SystemTools }
          else { ./scripts/test-system-host.ps1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-tools-${{ github.sha }}
          path: .local/system-tools-report.json
          if-no-files-found: ignore
