name: Multi-view client verification
on:
  push:
    branches: ["codex/multi-viewer-resilience", "codex/immersive-viewer-cascade", "codex/parallel-viewer-auth-isolation"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Restore original installed certificate
        env:
          APK_KEYSTORE: ${{ secrets.ANDROID_APK_KEYSTORE_BASE64 }}
        run: |
          test -n "$APK_KEYSTORE"
          printf '%s' "$APK_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/farsail-installed.jks"
          chmod 600 "$RUNNER_TEMP/farsail-installed.jks"
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo test --locked -p farsail-client --lib
      - run: cargo test --locked -p farsail-transport -p farsail-android
      - run: cargo clippy --locked -p farsail-transport -p farsail-android --all-targets -- -D warnings
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/farsail-installed.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APK_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: androiddebugkey
        run: scripts/build-android.sh :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signed-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-release-windows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test scripts/test-feedback-policy.mjs scripts/test-viewer-display-policy.mjs scripts/test-viewer-notice-policy.mjs
      - run: npm run typecheck
      - name: First-frame and delayed-selection browser regressions
        shell: pwsh
        run: |
          $uiTools = Join-Path $env:RUNNER_TEMP 'farsail-ui-tools'
          npm install --prefix $uiTools --no-save --package-lock=false playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $uiTools 'node_modules'
          $vite = Start-Process node -ArgumentList '../../node_modules/vite/bin/vite.js --host 127.0.0.1 --port 1420 --strictPort' -WorkingDirectory (Join-Path $PWD 'apps/desktop') -WindowStyle Hidden -PassThru
          try {
            for ($n=0; $n -lt 30; $n++) {
              try { Invoke-WebRequest http://127.0.0.1:1420 -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            $env:UI_BROWSER = 'msedge'
            node scripts/test-remote-viewer.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { if (!$vite.HasExited) { Stop-Process -Id $vite.Id -Force } }
      - run: cargo test --locked -p farsail-desktop --lib
      - run: cargo clippy --locked -p farsail-desktop --all-targets -- -D warnings
      - name: Package Windows verification installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: ./scripts/package-windows.ps1
      - name: Verify install and data-preserving replacement
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: multi-view-windows
          path: .local/windows-package/artifacts/*
          if-no-files-found: error
