limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/farsail/tls/fullchain.pem;
    ssl_certificate_key /run/farsail/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    client_body_timeout 10s;
    # No internal admission/admin bootstrap route is exposed through this proxy.
    location /internal { return 404; }
    location = /healthz { proxy_pass http://127.0.0.1:8787; }
    location /v1/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
