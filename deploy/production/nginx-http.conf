server {
    listen 8080;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
}
server {
    listen 127.0.0.1:8788;
    server_name _;
    location = /internal/relay-access {
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
    }
    location / { return 404; }
}
