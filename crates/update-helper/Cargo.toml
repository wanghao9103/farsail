[package]
name = "farsail-update-helper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
minisign-verify = "=0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fs2 = "0.4"
libc = "0.2"
tempfile = "3"
