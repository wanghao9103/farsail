[package]
name = "farsail-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
farsail-client = { path = "../client" }
farsail-core = { path = "../core" }
farsail-media = { path = "../media" }
farsail-transport = { path = "../transport" }
jni = "0.21.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "android")'.dependencies]
iroh = "=1.2.0"

[dev-dependencies]
axum = "0.8"
iroh = "=1.2.0"
hex = "0.4"
sha2 = "0.10"
