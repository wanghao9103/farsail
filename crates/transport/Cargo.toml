[package]
name = "farsail-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
iroh = "=1.2.0"
iroh-relay = "=1.2.0"
rustls-pki-types = "1"
hex = "0.4"
farsail-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
iroh = { version = "=1.2.0", features = ["unstable-net-report"] }
iroh-relay = { version = "=1.2.0", features = ["server"] }
rcgen = "0.14"
rustls = "0.23"
