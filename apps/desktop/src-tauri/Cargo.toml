[package]
name = "farsail-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "farsail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
farsail-client = { path = "../../../crates/client" }
farsail-core = { path = "../../../crates/core" }
farsail-transport = { path = "../../../crates/transport" }
farsail-media = { path = "../../../crates/media" }
farsail-windows = { path = "../../../crates/windows" }
iroh = "=1.2.0"
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
tempfile = "3"
url = "2"
tauri-plugin-updater = "=2.13.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-single-instance = "=2.5.2"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
libloading = "0.8"
gtk = "0.18.2"
gdk = "0.18.2"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
