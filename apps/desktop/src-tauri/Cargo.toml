[package]
name = "farsail-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "farsail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
farsail-client = { path = "../../../crates/client" }
farsail-core = { path = "../../../crates/core" }
farsail-transport = { path = "../../../crates/transport" }
farsail-media = { path = "../../../crates/media" }
farsail-windows = { path = "../../../crates/windows" }
iroh = "=1.2.0"
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1", features = ["time", "sync", "rt"] }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
