[package]
name = "farsail-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "farsail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
farsail-client = { path = "../../../crates/client" }
farsail-core = { path = "../../../crates/core" }
farsail-transport = { path = "../../../crates/transport" }
iroh = "=1.2.0"
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
